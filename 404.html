<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — ORA-00942</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#241c14">
<style>
  /* Police déclarée ici plutôt que chargée chez Google : la page reste
     autonome (voir plus bas) et le site n'a plus aucune dépendance externe.
     Chemin absolu : une 404 peut être servie depuis n'importe quelle URL. */
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/assets/fonts/JetBrainsMono-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }
  /* Page autonome : elle ne charge ni tf2.css ni Tailwind (une 404 doit
     s'afficher même si tout le reste casse), mais elle reprend à la main la
     palette Mann Co. et le panneau biseauté, pour ne pas dépayser. */
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #241c14;
    color: #c6b99b;
    font-family: 'JetBrains Mono', monospace;
    padding: 1.5rem;
  }
  .term {
    position: relative;
    isolation: isolate;
    width: min(640px, 100%);
    background: #57493a;                    /* la bordure du panneau */
    padding: 2rem 2.2rem;
    font-size: .9rem;
    line-height: 1.9;
    --cut: 14px;
    clip-path: polygon(var(--cut) 0%, 100% 0%, 100% calc(100% - var(--cut)),
                       calc(100% - var(--cut)) 100%, 0% 100%, 0% var(--cut));
  }
  .term::before {
    content: '';
    position: absolute; inset: 2px; z-index: -1;
    clip-path: polygon(var(--cut) 0%, 100% 0%, 100% calc(100% - var(--cut)),
                       calc(100% - var(--cut)) 100%, 0% 100%, 0% var(--cut));
    background: linear-gradient(180deg, #3a332b, #241f1a);
    box-shadow: inset 1.5px 1.5px 0 rgba(255,240,214,.16),
                inset -1.5px -1.5px 0 rgba(0,0,0,.55);
  }
  .bar { display: flex; gap: .45rem; margin-bottom: 1.3rem; }
  .bar span { width: 11px; height: 11px; background: #5f5549; }
  .bar span:first-child { background: #b8383b; }
  .p { color: #8cbb96; }
  .q { color: #99ccff; }
  .err { color: #e88a8c; }
  .dim { color: #a99c7f; font-size: .8rem; }
  a.cmd { color: #f0e7d2; text-decoration: underline; text-underline-offset: 4px; }
  a.cmd:hover { color: #e8913f; }
  a.cmd:focus-visible { outline: 2px solid #ffd700; outline-offset: 3px; }
  .caret { color: #e8913f; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body>
  <main class="term">
    <div class="bar" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="dim">mathyslan.github.io — session SQL*Plus</p>
    <p><span class="p">SQL&gt;</span> <span class="q">SELECT * FROM pages WHERE url = '<span id="path">…</span>';</span></p>
    <p class="err">ERROR 404 — ORA-00942: table or view does not exist</p>
    <p class="dim">0 rows selected. Cette page n'existe pas, et je ne vais pas casser le modèle pour l'inventer.</p>
    <p style="margin-top:1.1rem"><span class="p">SQL&gt;</span> <a class="cmd" href="/">ROLLBACK; -- retour à l'accueil</a><span class="caret">▍</span></p>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>

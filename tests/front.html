<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Test fonctionnel du front</title>
<style>
  body { margin:0; background:#111; color:#8f8; font:13px/1.6 monospace; }
  #log { padding:10px; white-space:pre-wrap; }
  iframe { width:1100px; height:900px; border:0; position:fixed; left:-9999px; }
  #m, #nojsm { width:390px; height:800px; }
  .ko { color:#f77; }
</style>
</head>
<body>
<div id="log">chargement…</div>
<iframe id="f" src="../index.html"></iframe>
<!-- Largeur telephone : menu burger. -->
<iframe id="m" src="../index.html"></iframe>
<!-- Sans JS : sandbox sans allow-scripts. Ce qui doit rester lisible et juste. -->
<iframe id="nojs" sandbox="allow-same-origin" src="../index.html"></iframe>
<!-- Sans JS ET en 390 px : le cas où le burger n'existe pas. C'est le seul
     endroit où le menu de secours <details> est censé apparaître. -->
<iframe id="nojsm" sandbox="allow-same-origin" src="../index.html"></iframe>
<script>
// Pilote le vrai index.html dans une iframe (meme origine avec
// --allow-file-access-from-files) : on ne touche pas au fichier livre.
// Lancer aussi avec --force-prefers-reduced-motion : les tests suivent le mode.
var out = [], errs = [];
function t(name, ok) { out.push((ok ? 'OK   ' : 'KO   ') + name); if (!ok) out.ko = true; }
var ran = false;   // un mailto: peut recharger l'iframe : on ne rejoue pas la suite
document.getElementById('f').addEventListener('load', function () {
  if (ran) return; ran = true;
  var w = this.contentWindow, d = this.contentDocument;
  w.addEventListener('error', function (e) { errs.push(e.message + ' @' + String(e.filename).split('/').pop() + ':' + e.lineno); });
  setTimeout(function () {
    var reduced = w.matchMedia('(prefers-reduced-motion: reduce)').matches;
    out.push('--- mode : ' + (reduced ? 'MOUVEMENT REDUIT' : 'mouvement normal'));
    try {
      // Sac a dos
      var cells = d.querySelectorAll('#projects-grid .bp-cell');
      t('cases du sac a dos (' + cells.length + '/8)', cells.length === 8);
      t('avec JS : fiches de secours masquees', w.getComputedStyle(d.getElementById('projects-sheets')).display === 'none');
      t('avec JS : contenu pre-rendu repris sans re-rendu (data-lang)', d.getElementById('projects-grid').dataset.lang === 'fr');
      t('cases focusables au clavier', cells[0].tagName === 'BUTTON');
      t('bordure de qualite posee', d.querySelector('.bp-cell[data-q="unusual"]') !== null);
      t('nom visible sans ouvrir', d.querySelector('.bp-cell .bp-name').textContent.trim().length > 0);
      t('rarete visible sans ouvrir', d.querySelectorAll('.bp-cell .bp-q').length === 8);
      t('cadenas sur le projet confidentiel', d.querySelectorAll('.bp-lock').length === 1);

      // Modale de description d'objet
      var im = d.getElementById('item-modal');
      t('modale fermee au depart', im.hidden);
      cells[1].click();
      t('clic ouvre la modale', !im.hidden);
      t('modale reprend la rarete de la case',
        im.querySelector('.im-panel').getAttribute('data-q') === cells[1].getAttribute('data-q'));
      t('descriptif complet repris', im.querySelector('.im-desc').textContent.length > 200);
      t('stack en attributs', im.querySelectorAll('.im-stack li').length > 0);
      t('focus place dans la modale', d.activeElement === im.querySelector('.im-close'));
      t('defilement de la page bloque', d.body.classList.contains('modal-open'));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      t('Echap ferme la modale', im.hidden);
      t('focus rendu a la case', d.activeElement === cells[1]);
      // Fiche structuree : objectif / ma part / resultat / equipe.
      cells[0].click();
      var facts0 = im.querySelectorAll('.im-facts .facts-row');
      t('fiche AgiLab : objectif, ma part, resultat (' + facts0.length + ' lignes)',
        facts0.length >= 3 && im.querySelector('.im-facts .facts-row.is-role') !== null);
      t('fiche : recit complet garde sous « En detail »',
        !im.querySelector('.im-desc-label').hidden && im.querySelector('.im-desc').textContent.length > 200);
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      cells[1].click();
      t('« Ma part » renseignee pour les 8 projets',
        w.eval('PROJECTS').every(function (p) { return p.role && p.role_en; }));
      t('fiche d equipe : taille de l equipe affichee',
        /Projet à 4/.test(im.querySelector('.im-facts').textContent));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      // Un projet sans depot ne doit pas afficher un lien GitHub mort.
      cells[0].click();
      t('lien GitHub masque si absent', im.querySelector('.im-gh').hidden);
      // .click() seul = ce que declenchent Entree et Espace sur le bouton.
      im.querySelector('.im-close').click();
      t('la croix de la fiche fonctionne au clavier', im.hidden);

      // Les comptes viennent de data/games.js, pas d'un nombre ecrit ici :
      // ajouter un jeu ne doit pas faire echouer la suite pour une mauvaise
      // raison. Ce qui est verifie reste le vrai sujet — CHAQUE jeu a sa carte,
      // et chaque jeu qui declare un `code` / un `arch` a son bouton.
      // GAMES est un `const` au premier niveau d'un script classique : il est
      // global mais PAS une propriete de window, donc `w.GAMES` vaut toujours
      // undefined. On passe par l'eval de l'iframe, qui voit sa portee lexicale.
      var GAMES = w.eval('GAMES');
      var nGames = GAMES.length;
      var nCode = GAMES.filter(function (g) { return !!g.code; }).length;
      var nArch = GAMES.filter(function (g) { return !!g.arch; }).length;

      var slides = d.querySelectorAll('.game-slide');
      t('cartes jeux rendues (' + slides.length + '/' + nGames + ')', slides.length === nGames);
      t('carte de jeu = objet', d.querySelector('.game-slide .item.game-card') !== null);
      // Jeux : Code et Architecture a cote de Jouer.
      var codes = d.querySelectorAll('.game-slide .game-code');
      t('jeux : ' + nCode + ' liens Code vers GitHub',
        codes.length === nCode && [].every.call(codes, function (a) { return a.href.indexOf('https://github.com/MathysLan/') === 0 && a.target === '_blank'; }));
      var archBtns = d.querySelectorAll('.game-slide .game-arch');
      t('jeux : ' + nArch + ' boutons Architecture', archBtns.length === nArch);
      archBtns[0].focus();
      archBtns[0].click();
      t('Architecture ouvre la fiche technique du jeu',
        !im.hidden && im.querySelector('.im-title').textContent === d.querySelectorAll('.game-slide .game-title')[0].textContent
        && im.querySelectorAll('.im-arch li').length >= 3 && im.querySelectorAll('.im-stack li').length > 0);
      t('fiche technique : lien vers le code', !im.querySelector('.im-gh').hidden && /github.com/.test(im.querySelector('.im-gh').href));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      t('fiche technique : Echap ferme, focus rendu au bouton', im.hidden && d.activeElement === archBtns[0]);
      archBtns[0].blur();
      t('jeux preferes (' + d.querySelectorAll('#fav-games .fav-game').length + ')', d.querySelectorAll('#fav-games .fav-game').length > 0);

      // ConTracker
      var contracts = d.querySelectorAll('.contract');
      t('contrats rendus (' + contracts.length + '/5)', contracts.length === 5);
      t('13 etoiles d objectif', d.querySelectorAll('.objective .star').length === 13);
      t('1 objectif encore en cours', d.querySelectorAll('.objective .star-empty').length === 1);
      var cdi = d.getElementById('h-cdi');
      t('contrat en cours ouvert par defaut', cdi.getAttribute('aria-expanded') === 'true'
        && !d.getElementById('c-cdi').hidden);
      var bac = d.getElementById('h-bac');
      t('contrat ferme au depart', bac.getAttribute('aria-expanded') === 'false' && d.getElementById('c-bac').hidden);
      bac.click();
      t('clic ouvre le contrat', bac.getAttribute('aria-expanded') === 'true' && !d.getElementById('c-bac').hidden);
      bac.click();
      t('re-clic le referme', bac.getAttribute('aria-expanded') === 'false' && d.getElementById('c-bac').hidden);
      bac.focus();
      t('anneau de focus sur l en-tete de contrat',
        /inset/.test(w.getComputedStyle(bac).boxShadow));

      // Lightbox : ouverte depuis la modale, elle doit passer AU-DESSUS d'elle.
      var lb = d.getElementById('lightbox');
      t('lightbox fermee : hors clavier et lecteurs (visibility)', w.getComputedStyle(lb).visibility === 'hidden');
      cells[1].click();
      var shotsBtn = im.querySelector('.im-shots');
      shotsBtn.focus();
      shotsBtn.click();
      t('lightbox ouverte depuis la modale', lb.classList.contains('open'));
      t('lightbox au-dessus de la modale',
        +w.getComputedStyle(lb).zIndex > +w.getComputedStyle(im).zIndex);
      t('focus dans la lightbox', d.activeElement === d.getElementById('lightbox-close'));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
      t('Tab reste dans la lightbox', lb.contains(d.activeElement));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      t('Echap ferme la lightbox', !lb.classList.contains('open'));
      // Deux ecouteurs Echap sur document : la fiche dessous ne doit PAS se fermer aussi.
      t('... mais pas la fiche d objet dessous', !im.hidden);
      t('focus rendu au bouton captures', d.activeElement === shotsBtn);
      im.querySelector('.im-close').click();
      t('fiche refermee avant la suite', im.hidden);

      // Palette de commandes
      var langBtn = d.getElementById('lang-toggle');
      langBtn.focus();
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'k', ctrlKey: true, bubbles: true }));
      t('palette Ctrl+K ouverte', d.getElementById('cmdk-overlay').classList.contains('open'));
      var ck = d.querySelector('#cmdk input');
      t('palette : champ nomme, liste d options',
        ck.getAttribute('role') === 'combobox' && ck.hasAttribute('aria-label')
        && d.querySelectorAll('#cmdk-list [role="option"]').length > 5);
      t('palette : option active annoncee', ck.getAttribute('aria-activedescendant') === 'cmdk-opt-0');
      ck.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
      t('palette : fleche bas deplace l option active',
        ck.getAttribute('aria-activedescendant') === 'cmdk-opt-1'
        && d.getElementById('cmdk-opt-1').getAttribute('aria-selected') === 'true');
      // Echap est ecoute sur le champ de saisie (qui recoit le focus a
      // l'ouverture), pas sur le document : on dispatche donc au bon endroit.
      d.querySelector('#cmdk input').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      t('palette refermee (Echap)', !d.getElementById('cmdk-overlay').classList.contains('open'));
      t('palette : focus rendu a l element d origine', d.activeElement === langBtn);
      // Copier l'adresse : clic ici, resultat lu dans la phase finale (le
      // presse-papiers repond de facon asynchrone, filet d'1 s cote site).
      d.getElementById('copy-mail').click();

      // SEO : ce que lisent les moteurs et les apercus de partage.
      var head = function (sel, attr) { var el = d.head.querySelector(sel); return el ? el.getAttribute(attr) : null; };
      t('SEO : canonical absolue', head('link[rel="canonical"]', 'href') === 'https://mathyslan.github.io/');
      t('SEO : og:image en URL absolue', head('meta[property="og:image"]', 'content') === 'https://mathyslan.github.io/assets/og-image.png');
      t('SEO : carte Twitter grand format', head('meta[name="twitter:card"]', 'content') === 'summary_large_image');
      var ld = null;
      try { ld = JSON.parse(d.head.querySelector('script[type="application/ld+json"]').textContent); } catch (e) {}
      t('SEO : JSON-LD Person valide', !!ld && ld['@type'] === 'Person' && ld.name === 'Mathys Langiny');
      var titleFr = d.title;

      // Langue
      d.getElementById('lang-toggle').click();
      t('SEO : titre et description suivent la langue',
        d.title !== titleFr && /admin/i.test(d.title)
        && /Portfolio of/.test(head('meta[name="description"]', 'content')));
      var h2 = d.querySelector('#projects h2');
      t('bascule EN [' + h2.textContent.trim().slice(0, 16) + ']', /project/i.test(h2.textContent));
      t('competences traduites [' + d.getElementById('loadout-name').textContent + ']',
        d.getElementById('loadout-name').textContent === 'Strange DB Admin');
      d.querySelector('#projects-grid .bp-cell').click();
      t('fiche projet en anglais (My part / Goal)',
        /My part/.test(d.querySelector('#item-modal .im-facts').textContent) && /Goal/.test(d.querySelector('#item-modal .im-facts').textContent)
        && /Designed and industrialized/.test(d.querySelector('#item-modal .im-facts').textContent));
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      t('aria-label traduits en EN [' + d.getElementById('lightbox-close').getAttribute('aria-label') + ']',
        d.getElementById('lightbox-close').getAttribute('aria-label') === 'Close'
        && d.getElementById('games-next').getAttribute('aria-label') === 'Next game');
      t('pictogrammes de nav conserves (' + d.querySelectorAll('.nav-link svg').length + '/6)', d.querySelectorAll('.nav-link svg').length === 6);
      // Volley : Mathys s'oriente vers PASSEUR. Le texte ne doit jamais laisser
      // croire qu'il est deja affecte a ce poste dans un club.
      t('EN : volley = setter, pas middle blocker',
        d.querySelector('[data-i18n="passions.volley.title"]').textContent === 'Setter'
        && /moving toward setter/.test(d.querySelector('[data-i18n="passions.volley.sub"]').textContent)
        && !/middle/i.test(d.querySelector('[data-i18n="hero.tagline"]').textContent));
      d.getElementById('lang-toggle').click();
      t('retour FR', /Projets/.test(d.querySelector('#projects h2').textContent));
      t('FR : volley = passeur, en cours d orientation',
        d.querySelector('[data-i18n="passions.volley.title"]').textContent === 'Passeur'
        && /orientation passeur/.test(d.querySelector('[data-i18n="passions.volley.sub"]').textContent)
        && /passeur au volley/.test(d.querySelector('[data-i18n="hero.tagline"]').textContent)
        && !/central/i.test(d.querySelector('[data-i18n="passions.volley.desc"]').textContent));

      // Theme
      var crossDark = w.getComputedStyle(d.getElementById('theme-toggle')).cursor;
      d.getElementById('theme-toggle').click();
      t('theme blueprint actif', d.documentElement.classList.contains('light'));
      // Le reticule s'inverse avec le theme (un token par theme, cf. tf2.css).
      t('reticule a la couleur du theme',
        /url\(/.test(w.getComputedStyle(d.getElementById('theme-toggle')).cursor)
        && w.getComputedStyle(d.getElementById('theme-toggle')).cursor !== crossDark);
      // Sur papier la tache assombrit le fond sous des encres sombres : elle doit rester legere.
      t('texture plus legere en Blueprint',
        +w.getComputedStyle(d.querySelector('.section-halo'), '::after').opacity <= .15);
      d.getElementById('theme-toggle').click();
      t('retour Mann Co.', !d.documentElement.classList.contains('light'));

      // Guichet : refuse le vide, sans naviguer
      var f = d.getElementById('contact-form');
      f.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
      t('guichet refuse les champs vides', d.getElementById('cf-hint').textContent.length > 0);

      // Focus clavier sur un element decoupe (clip-path rogne les outlines)
      var b = d.querySelector('.tf-btn');
      b.focus();
      var sh = w.getComputedStyle(b).boxShadow;
      t('anneau de focus sur bouton decoupe', /inset/.test(sh) && sh.indexOf('rgb(255, 215, 0)') > -1);

      // Consolidation des CTA : tout passe par la primitive, plus de doublons.
      t('les CTA passent par .tf-btn (' + d.querySelectorAll('.tf-btn').length + ')',
        d.querySelectorAll('.tf-btn').length >= 12);
      t('plus aucun .ctrl-btn ni .btn-glow',
        d.querySelectorAll('.ctrl-btn, .btn-glow').length === 0);
      t('le CTA du hero est un bouton d achat',
        d.querySelector('#hero a[href="#projects"]').classList.contains('tf-btn-buy'));
      t('les liens sociaux sont des boutons icone',
        d.querySelectorAll('#contact .tf-icon-btn-lg').length === 5);
      // .tf-btn s'enfonce au survol avec un transform : une fleche centree par
      // translateY(-50%) serait ecrasee. Elle doit l'etre par margin-top.
      var arrow = d.getElementById('games-next');
      var vp = d.getElementById('games-viewport');
      var da = Math.abs((arrow.getBoundingClientRect().top + arrow.getBoundingClientRect().height / 2)
                      - (vp.getBoundingClientRect().top + vp.getBoundingClientRect().height / 2));
      t('fleches du carousel centrees (ecart ' + da.toFixed(1) + 'px)', da < 2);
      // L'etat « bientot » ne doit pas se faire passer pour cliquable.
      var ghost = d.querySelector('.tf-btn-ghost');
      t('l etat indisponible n est pas cliquable',
        !ghost || w.getComputedStyle(ghost).cursor !== 'pointer');

      // Competences : la description d'objet du hero
      var lo = d.querySelector('#hero .loadout');
      t('carte de competences dans le hero', lo !== null);
      var pos = lo.querySelectorAll('.attr-list li:not(.neg)'), neg = lo.querySelectorAll('.attr-list li.neg');
      t('attributs bleus (' + pos.length + ') et rouges (' + neg.length + ')', pos.length >= 5 && neg.length >= 1 && neg.length <= 2);
      // Le + et le − viennent du CSS : les ecrire aussi dans le texte les doublerait.
      t('pas de +/− en dur dans le texte',
        [].every.call(lo.querySelectorAll('.attr-list li'), function (li) { return !/^[+\-−]/.test(li.textContent.trim()); }));
      t('attribut negatif en rouge',
        w.getComputedStyle(neg[0]).color !== w.getComputedStyle(pos[0]).color
        && w.getComputedStyle(neg[0], '::before').content.indexOf('−') > -1);
      // Sonde : un span colore en var(--q-ink) dans la carte donne l'encre attendue.
      var probe = d.createElement('span');
      probe.style.color = 'var(--q-ink)';
      lo.querySelector('[data-q]').appendChild(probe);
      t('nom a l encre de sa qualite',
        w.getComputedStyle(d.getElementById('loadout-name')).color === w.getComputedStyle(probe).color);
      probe.remove();
      t('carte nommee pour les lecteurs d ecran', lo.getAttribute('aria-labelledby') === 'loadout-name');
      var rt = d.getElementById('hero-title').getBoundingClientRect(), rl = lo.getBoundingClientRect();
      t('la carte ne chevauche pas le nom',
        rl.left >= rt.right || rl.top >= rt.bottom || rl.right <= rt.left || rl.bottom <= rt.top);

      // Textures de fond : une couche d'usure par section, generee, discrete.
      var halos = d.querySelectorAll('.section-halo');
      t('texture sur les 7 blocs (' + halos.length + ')', halos.length === 7 && [].every.call(halos, function (h) {
        return /data:image\/svg/.test(w.getComputedStyle(h, '::after').backgroundImage);
      }));
      // Sans region de filtre explicite, le bruit se repete a 864 px sur une
      // tuile de 720 : des coutures verticales apparaissent.
      t('texture sans couture (region de filtre = tuile)',
        /userSpaceOnUse/.test(w.getComputedStyle(d.documentElement).getPropertyValue('--tex-stains')));
      t('texture discrete en Mann Co. (opacite ' + w.getComputedStyle(halos[1], '::after').opacity + ')',
        +w.getComputedStyle(halos[1], '::after').opacity <= .5);
      t('texture non cliquable', w.getComputedStyle(halos[1]).pointerEvents === 'none');

      // Reticule : seulement sur ce qu'on vise.
      function cur(el) { return el ? w.getComputedStyle(el).cursor : '(absent)'; }
      function cross(el) { return /url\(/.test(cur(el)); }
      t('reticule sur les boutons', cross(d.querySelector('#hero .tf-btn-buy')) && cross(d.getElementById('theme-toggle')));
      // Requete fraiche : la bascule de langue a re-rendu les cases, cells[] est detache.
      t('reticule sur les cases du sac a dos', cross(d.querySelector('#projects-grid .bp-cell')));
      t('reticule sur le carousel et ses liens',
        cross(d.getElementById('games-viewport')) && cross(d.querySelector('#games-viewport a.game-cta, #games-viewport button.game-cta')));
      t('pas de reticule ailleurs [' + cur(d.body) + ']',
        !cross(d.body) && !cross(d.querySelector('#assos p')) && !cross(d.querySelector('#timeline h2')));
      t('les champs gardent leur curseur', !cross(d.getElementById('cf-name')) && !cross(d.getElementById('cf-message')));
      t('l etat indisponible n a pas le reticule', !ghost || !cross(ghost));

      // Easter egg : le Spy crabe. Les etapes s'enchainent sur animationend ;
      // on les declenche a la main pour ne pas attendre les 3 s de marche.
      var spy = d.getElementById('spy-trigger'), crab = d.getElementById('spycrab'), note = d.getElementById('secret-note');
      function arrive(name) { crab.dispatchEvent(new w.AnimationEvent('animationend', { animationName: name, bubbles: true })); }
      t('declencheur = bouton nomme', spy.tagName === 'BUTTON' && spy.textContent.trim().length > 0);
      t('crabe et fiche caches au depart', crab.hidden && note.hidden);
      spy.click();
      if (reduced) {
        t('mouvement reduit : le Spy apparait sans marcher', !crab.hidden && !crab.classList.contains('is-walking'));
      } else {
        t('clic : le Spy entre en marchant', !crab.hidden && crab.classList.contains('is-walking') && note.hidden);
      }
      t('le crabe ne bloque aucun clic', w.getComputedStyle(crab).pointerEvents === 'none');
      spy.click();
      t('un seul Spy a la fois', d.querySelectorAll('.spycrab').length === 1);
      if (!reduced) arrive('crab-in');
      t('arrive au milieu : la fiche s ouvre', !note.hidden && crab.classList.contains('is-idle'));
      t('focus sur OK', d.activeElement === note.querySelector('.secret-ok'));
      t('fiche annoncee ouverte', spy.getAttribute('aria-expanded') === 'true');
      t('fiche = description d objet', note.querySelector('.item-desc [data-q], .item-desc[data-q]') !== null
        && note.querySelectorAll('.attr-list li').length >= 3);
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      t('Echap ferme la fiche, focus rendu au masque', note.hidden && d.activeElement === spy);
      if (!reduced) {
        t('puis le Spy repart', crab.classList.contains('is-leaving') && !crab.hidden);
        arrive('crab-out');
      }
      t('sorti : crabe cache, rejouable', crab.hidden && crab.className === 'spycrab');

      // Nav au scroll
      var nav = d.querySelector('#navbar nav');
      t('nav sans panneau en haut de page', !nav.classList.contains('panel'));

      // Killfeed : decoratif, pas annonce.
      t('killfeed cache des lecteurs d ecran',
        d.getElementById('killfeed').getAttribute('aria-hidden') === 'true' && !d.getElementById('killfeed').hasAttribute('aria-live'));
      t('menu mobile inerte quand il est ferme', d.getElementById('mobile-menu').inert === true);

      // Carousel au clavier et au lecteur d'ecran
      var car = d.getElementById('games-carousel');
      t('carousel : role region + description', car.getAttribute('role') === 'region' && car.hasAttribute('aria-roledescription'));
      var dotsEl = d.querySelectorAll('#games-dots .game-dot');
      t('carousel : points nommes par le jeu [' + dotsEl[0].getAttribute('aria-label') + ']',
        dotsEl[0].getAttribute('aria-label') === d.querySelector('.game-slide .game-title').textContent);
      t('carousel : point actif signale', d.querySelectorAll('#games-dots [aria-current="true"]').length === 1);
      var pb = d.getElementById('games-pause');
      if (reduced) {
        t('mouvement reduit : pas de bouton pause (pas de rotation)', pb.hidden);
      } else {
        pb.click();
        t('pause : etat annonce', pb.getAttribute('aria-pressed') === 'true' && /Reprendre|Resume/.test(pb.getAttribute('aria-label')));
        pb.click();
        t('reprise : etat annonce', pb.getAttribute('aria-pressed') === 'false');
      }
      var slidesNow = d.querySelectorAll('.game-slide');
      var sideLink = slidesNow[2].querySelector('.game-cta');
      sideLink.focus();
      t('focus sur une carte laterale : elle vient au centre', slidesNow[2].classList.contains('is-active'));
      sideLink.blur();

      // Mouvement reduit : les animations JS doivent suivre la preference.
      var term = d.getElementById('term-line');
      if (reduced) {
        t('mouvement reduit : terminal sans frappe (ligne complete)',
          term.textContent === w.eval('TERM_LINES').fr[0] && !term.classList.contains('terminal-caret'));
        t('mouvement reduit : compteurs directement a leur valeur',
          [].every.call(d.querySelectorAll('[data-count]'), function (c) { return c.textContent === c.dataset.count; }));
      } else {
        t('mouvement normal : le terminal tape', term.classList.contains('terminal-caret'));
      }

    } catch (e) {
      out.push('EXCEPTION: ' + e.message);
      out.ko = true;
    }

    // Guichet : la barre de capture. Asynchrone (1,1 s de remplissage), donc
    // en dernier, avant le verdict.
    try {
      var cfm = d.getElementById('contact-form'), cap = d.getElementById('cf-capture');
      var sub = cfm.querySelector('[type="submit"]'), hint = d.getElementById('cf-hint');
      // On intercepte l'ouverture du client mail : en headless, un vrai mailto:
      // bloque le navigateur. main.js emet guichet:send juste avant.
      var mailto = null;
      cfm.addEventListener('guichet:send', function (ev) { mailto = ev.detail.url; ev.preventDefault(); });
      t('barre de capture cachee au depart', cap.hidden);
      cfm.elements.name.value = 'Test'; cfm.elements.subject.value = 'Objet'; cfm.elements.message.value = 'Message';
      cfm.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
      t('envoi valide : la capture demarre', !cap.hidden && cap.classList.contains('is-running'));
      t('bouton bloque pendant la capture', sub.disabled);
      t('le client mail attend la fin de la capture', mailto === null);
      t('la barre prend la couleur de l equipe',
        /rgb\(184, 56, 59\)/.test(w.getComputedStyle(cap.querySelector('.capture-point')).boxShadow));
      t('pas de « signal securise » avant la fin', w.getComputedStyle(cap.querySelector('.capture-done')).display === 'none');
    } catch (e) { out.push('EXCEPTION capture: ' + e.message); out.ko = true; }

    setTimeout(function () {
      try {
        t('fin : signal securise affiche',
          cap.classList.contains('is-done') && w.getComputedStyle(cap.querySelector('.capture-done')).display !== 'none'
          && /Signal/i.test(cap.querySelector('.capture-done').textContent));
        t('fin : barre pleine', cap.querySelector('.capture-fill').getBoundingClientRect().width
          >= cap.querySelector('.capture-track').getBoundingClientRect().width - 8);
        t('fin : annonce du client mail (lecteurs d ecran)', hint.textContent.length > 0 && !/Signal/i.test(hint.textContent));
        t('fin : bouton rendu', !sub.disabled);
        t('fin : mailto compose (objet + message + nom)',
          /^mailto:mathys\.langiny@gmail\.com\?subject=Objet&body=Message%0A%0A--%20Test$/.test(mailto || ''));
        cfm.elements.name.value = '';
        cfm.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
        t('un champ vide masque la barre', cap.hidden);

      } catch (e) { out.push('EXCEPTION capture fin: ' + e.message); out.ko = true; }

      var cms = d.getElementById('copy-mail-status').textContent;
      t('copier l adresse : resultat annonce [' + cms + ']', /copiée|copied|impossible|not available/i.test(cms));
      t('message du guichet honnete (rien ne part sans l utilisateur)',
        /ne part que quand tu l'envoies/.test(w.eval('I18N').fr['contact.store.sent']));

      // --- Telephone (390 px) : le menu burger ---
      try {
        var mw = document.getElementById('m').contentWindow, md = mw.document;
        var burger = md.getElementById('burger'), menu = md.getElementById('mobile-menu');
        var links = menu.querySelectorAll('a');
        t('mobile : burger visible', mw.getComputedStyle(burger).display !== 'none');
        t('mobile : burger relie au menu, ferme', burger.getAttribute('aria-controls') === 'mobile-menu'
          && burger.getAttribute('aria-expanded') === 'false' && menu.inert);
        burger.click();
        t('mobile : ouverture annoncee, menu actif', burger.getAttribute('aria-expanded') === 'true' && !menu.inert
          && /Fermer|Close/.test(burger.getAttribute('aria-label')));
        t('mobile : focus sur le premier lien', md.activeElement === links[0]);
        t('mobile : page derriere bloquee', md.body.style.overflow === 'hidden');
        links[links.length - 1].focus();
        md.dispatchEvent(new mw.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        t('mobile : Tab apres le dernier lien revient au burger', md.activeElement === burger);
        md.dispatchEvent(new mw.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        t('mobile : Echap ferme et rend le focus au burger', burger.getAttribute('aria-expanded') === 'false'
          && menu.inert && md.activeElement === burger && md.body.style.overflow === '');
        burger.click();
        links[1].click();
        t('mobile : un lien ferme le menu', burger.getAttribute('aria-expanded') === 'false' && menu.inert);
        t('mobile : pas de debordement horizontal (' + md.documentElement.scrollWidth + 'px)',
          md.documentElement.scrollWidth <= 390);
      } catch (e) { out.push('EXCEPTION mobile: ' + e.message); out.ko = true; }

      // --- Sans JavaScript ---
      try {
        var nd = document.getElementById('nojs').contentDocument;
        t('sans JS : pas de classe js', !nd.documentElement.classList.contains('js'));
        t('sans JS : compteurs a leur vraie valeur (' +
          [].map.call(nd.querySelectorAll('[data-count]'), function (c) { return c.textContent; }).join('/') + ')',
          [].every.call(nd.querySelectorAll('[data-count]'), function (c) { return c.textContent === c.dataset.count; }));
        var nw = document.getElementById('nojs').contentWindow;
        t('sans JS : le contenu .reveal reste visible',
          [].every.call(nd.querySelectorAll('.reveal'), function (r) { return nw.getComputedStyle(r).opacity === '1'; }));
        // Contenu pre-rendu par tools/build.mjs : present sans executer de JS.
        t('sans JS : 8 cases de projets dans le HTML', nd.querySelectorAll('#projects-grid .bp-cell').length === 8);
        var sheets = nd.querySelectorAll('#projects-sheets .nojs-sheet');
        t('sans JS : fiches de projet visibles avec descriptif',
          sheets.length === 8 && nw.getComputedStyle(nd.getElementById('projects-sheets')).display !== 'none'
          && sheets[1].textContent.length > 200);
        t('sans JS : ' + nGames + ' cartes de jeu, en grille lisible',
          nd.querySelectorAll('#games-track .game-slide').length === nGames
          && nw.getComputedStyle(nd.querySelector('.game-slide')).position === 'static');
        t('sans JS : jeux preferes presents', nd.querySelectorAll('#fav-games .fav-game').length > 0);
        t('sans JS : architecture des jeux lisible dans les cartes',
          nd.querySelectorAll('.game-arch-list').length === nArch
          && nw.getComputedStyle(nd.querySelector('.game-arch-list')).display !== 'none');
        t('sans JS : fiches de projet structurees', nd.querySelectorAll('#projects-sheets .facts').length === 8);
        t('sans JS : boutons qui dependent du JS masques',
          [].every.call(nd.querySelectorAll('.js-only'), function (b) { return nw.getComputedStyle(b).display === 'none'; }));
        t('sans JS : objectifs des contrats lisibles',
          [].every.call(nd.querySelectorAll('.contract-body'), function (b) { return nw.getComputedStyle(b).display !== 'none'; }));

        // Le menu de secours <details> : le SEUL moyen d'atteindre une section
        // sans JS sur telephone (le burger a besoin de JS, la liste du header
        // est masquee sous 768 px).
        var mw2 = document.getElementById('nojsm').contentWindow, md2 = mw2.document;
        var det = md2.querySelector('.nojs-nav');
        t('sans JS (390 px) : menu de secours present et visible',
          !!det && mw2.getComputedStyle(det).display !== 'none');
        var dlinks = det ? det.querySelectorAll('ul a') : [];
        t('sans JS (390 px) : les 6 sections sont atteignables',
          [].map.call(dlinks, function (a) { return a.getAttribute('href'); }).join(',')
          === '#projects,#timeline,#assos,#passions,#games,#contact');
        t('sans JS (390 px) : le menu est un <details> replie, avec un nom',
          det && det.tagName === 'DETAILS' && !det.open
          && det.querySelector('summary').getAttribute('aria-label').length > 0);
        t('sans JS (390 px) : il s ouvre sans script',
          (function () { det.open = true; var ul = det.querySelector('ul');
            var vis = mw2.getComputedStyle(ul).display !== 'none' && ul.getBoundingClientRect().height > 0;
            det.open = false; return vis; })());
        t('sans JS (390 px) : pas de debordement horizontal',
          md2.documentElement.scrollWidth <= 390);
        t('avec JS : le menu de secours disparait',
          w.getComputedStyle(d.querySelector('.nojs-nav')).display === 'none');

        // Plus aucune police externe, sur aucune page.
        t('aucun appel a Google Fonts dans le <head>',
          d.querySelectorAll('link[href*="fonts.googleapis"], link[href*="fonts.gstatic"]').length === 0);
        t('JetBrains Mono auto-hebergee',
          [].some.call(d.styleSheets, function (s) {
            try { return [].some.call(s.cssRules, function (r) {
              return r.constructor.name === 'CSSFontFaceRule' && /JetBrains/.test(r.style.fontFamily); }); }
            catch (e) { return false; }
          }));
        t('favicon declaree', !!d.querySelector('link[rel~="icon"]'));
      } catch (e) { out.push('EXCEPTION sans JS: ' + e.message); out.ko = true; }

      // --- Presse-papiers : les chemins qu'un clic normal ne montre jamais.
      // On ne peut PAS vérifier en headless qu'un vrai writeText() réussit (ni
      // permission, ni page sécurisée). Ce qui est vérifiable, et vérifié ici,
      // c'est toute la mécanique autour : le repli, le filet d'1 s, le fait que
      // report() soit appelé exactement une fois, et surtout qu'aucun faux
      // « Adresse copiée ✓ » ne puisse s'afficher quand rien n'a été copié.
      var nav = w.navigator;
      var realClip = Object.getOwnPropertyDescriptor(nav, 'clipboard');
      var realSecure = Object.getOwnPropertyDescriptor(w, 'isSecureContext');
      var realExec = d.execCommand;
      function stubClipboard(writeText, execOk) {
        Object.defineProperty(nav, 'clipboard', { value: { writeText: writeText }, configurable: true });
        Object.defineProperty(w, 'isSecureContext', { value: true, configurable: true });
        d.execCommand = function () { return execOk; };
      }
      function restoreClipboard() {
        if (realClip) Object.defineProperty(nav, 'clipboard', realClip); else delete nav.clipboard;
        if (realSecure) Object.defineProperty(w, 'isSecureContext', realSecure); else delete w.isSecureContext;
        d.execCommand = realExec;
      }
      var rejected = function () { return Promise.reject(new Error('refusé')); };

      // 1. Refus du presse-papiers, repli qui marche.
      var c1 = [];
      stubClipboard(rejected, true);
      w.copyEmailAddress(function (ok) { c1.push(ok); });

      setTimeout(function () {
        t('presse-papiers refuse : repli utilise, une seule reponse', c1.length === 1 && c1[0] === true);

        // 2. Tout echoue : le bouton doit le DIRE, jamais annoncer un succes.
        stubClipboard(rejected, false);
        d.getElementById('copy-mail-status').textContent = '';
        d.getElementById('copy-mail').click();

        setTimeout(function () {
          var m = d.getElementById('copy-mail-status').textContent;
          t('echec total : message affiche, et aucun faux succes [' + m + ']',
            m.length > 0 && !/copiée|copied/i.test(m));

          // 3. Promesse qui ne se regle jamais : le filet doit prendre le relais.
          var c3 = [], t0 = Date.now(), late;
          stubClipboard(function () { return new Promise(function (r) { late = r; }); }, true);
          w.copyEmailAddress(function (ok) { c3.push([ok, Date.now() - t0]); });

          setTimeout(function () {
            t('promesse en suspens : rien n est annonce trop tot', c3.length === 0);
          }, 400);
          setTimeout(function () {
            t('promesse en suspens : le filet repond (~1 s) et une seule fois',
              c3.length === 1 && c3[0][0] === true && c3[0][1] >= 900);
            // 4. Le vrai presse-papiers repond APRES le filet : pas de doublon.
            if (late) late();
            setTimeout(function () {
              t('reponse tardive du presse-papiers : pas de seconde annonce', c3.length === 1);
              restoreClipboard();
              hubTests(finish);
            }, 150);
          }, 1300);
        }, 80);
      }, 80);

      // --- Section Jeux : l'entrée du Game Hub (mode groupe, games/) et la
      // caisse SOLO (js/gamehub.js). La caisse ouvre un dialogue construit à la
      // volée : on vérifie ce qui casse en silence — la sélection des jeux, le
      // clavier, l'annonce du résultat, et le retour à un état stable.
      function hubTests(done) {
        var reducedMotion = w.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var hub = w.gameHub;
        t('hub : module charge', !!hub && typeof hub.playable === 'function');
        if (!hub) { done(); return; }

        var jouables = hub.playable();
        t('hub : ne propose que des jeux lancables (' + jouables.length + ')',
          jouables.length > 0 && jouables.every(function (g) {
            return g.status === 'live' && (g.href || g.action);
          }));
        t('hub : « La suite » (soon) est exclue',
          !jouables.some(function (g) { return g.id === 'soon'; }));
        var noms = jouables.map(function (g) { return [g.title, g.title_en]; });
        var estJouable = function (nom) {
          return noms.some(function (n) { return n[0] === nom || n[1] === nom; });
        };

        // --- la caisse
        var crateBtn = d.getElementById('crate-btn');
        t('caisse : bouton present, nomme, et masque sans JS',
          !!crateBtn && (crateBtn.getAttribute('aria-label') || '').length > 5
          && crateBtn.closest('.js-only') !== null);
        crateBtn.click();
        var ov = d.querySelector('.hub-overlay');
        t('caisse : dialogue modal ouvert',
          !!ov && ov.getAttribute('role') === 'dialog' && ov.getAttribute('aria-modal') === 'true');
        t('caisse : focus place dans le dialogue', ov.contains(d.activeElement));
        t('caisse : defilement de la page bloque', d.body.style.overflow === 'hidden');
        t('caisse : la caisse est un decor, pas du contenu',
          d.querySelector('.hub-crate').getAttribute('aria-hidden') === 'true');
        // Tab tourne dans le dialogue
        var foc = [].slice.call(ov.querySelectorAll('button'));
        foc[foc.length - 1].focus();
        d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
        t('caisse : Tab reste dans le dialogue', ov.contains(d.activeElement));

        // On garde la reference AVANT le clic : en mouvement reduit la
        // revelation est immediate et remplace les boutons, donc
        // querySelector('.tf-btn-buy') renverrait alors « Jouer ».
        var openBtn = ov.querySelector('.tf-btn-buy');
        openBtn.click();
        t('caisse : pas de double tirage possible',
          openBtn.disabled === true || !!d.querySelector('.hub-result .hub-item'));

        setTimeout(function () {
          var item = d.querySelector('.hub-result .hub-item');
          t('caisse : un jeu est revele', !!item);
          if (item) {
            var nom = item.querySelector('.hub-item-name').textContent.trim();
            t('caisse : le jeu tire est jouable [' + nom + ']', estJouable(nom));
            t('caisse : bordure de qualite posee, comme une case du sac a dos',
              item.hasAttribute('data-q'));
            var live = d.querySelector('.hub-live');
            t('caisse : resultat annonce aux lecteurs d ecran',
              live.getAttribute('role') === 'status' && live.textContent.indexOf(nom) !== -1);
            t('caisse : le resultat ne depend pas de la couleur seule',
              item.querySelector('.hub-item-name').textContent.length > 0);
          }
          if (reducedMotion) t('mouvement reduit : pas de roulette, revelation directe', !!item);
          else t('mouvement normal : la roulette a defile',
            (d.querySelector('.crate-strip') || {}).childElementCount > 0);

          d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
          t('caisse : Echap ferme, defilement rendu, focus rendu au bouton',
            !d.querySelector('.hub-overlay') && d.body.style.overflow === '' && d.activeElement === crateBtn);

          // --- garde-fou : plus aucun jeu dans les donnees
          // GAMES vit dans l iframe : on passe par w.eval pour obtenir la
          // VRAIE reference du tableau, qu on vide puis qu on remplit a nouveau.
          var jeuxReels = w.eval('GAMES');
          var sauvegarde = jeuxReels.slice();
          jeuxReels.length = 0;
          var boom = false;
          try { crateBtn.click(); } catch (e) { boom = true; }
          t('caisse : sans donnees, un message au lieu d une erreur',
            !boom && !!d.querySelector('.hub-empty'));
          d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
          [].push.apply(jeuxReels, sauvegarde);

          // --- l'entrée du Game Hub : le mode groupe
          var lien = d.getElementById('hub-link');
          t('game hub : une entrée visible dans la section Jeux',
            !!lien && !!lien.closest('#games') && lien.getBoundingClientRect().height > 40);
          t('game hub : un vrai lien vers games/ (chemin relatif, compatible GitHub Pages)',
            !!lien && lien.getAttribute('href') === 'games/' && lien.tagName === 'A');
          t('game hub : pas en .js-only — il marche sans JavaScript', !!lien && !lien.closest('.js-only'));
          t('game hub : nom accessible et description',
            !!lien && (lien.getAttribute('aria-label') || '').length > 10 && !!d.getElementById(lien.getAttribute('aria-describedby')));
          t('game hub : présenté comme le mode entre amis',
            !!lien && /amis|friends/i.test(lien.textContent) && /Game Hub/.test(lien.textContent));
          var directs = [].slice.call(d.querySelectorAll('#games-track .game-cta[href^="games/"]'))
            .map(function (a) { return a.getAttribute('href'); });
          var attendus = w.eval('GAMES').filter(function (g) { return g.status === 'live' && g.href; });
          t('jeux : les liens directs vers chaque jeu restent (' + directs.length + '/' + attendus.length + ')',
            attendus.every(function (g) { return directs.indexOf(g.href) !== -1; }) && directs.indexOf('games/') === -1);
          t('faux matchmaking retiré : plus de bouton qui prétend trouver un groupe',
            !d.getElementById('mm-btn') && !/Trouver une partie|Find a match/.test(d.getElementById('games').textContent)
            && typeof hub.openMatchmaking === 'undefined');
          t('caisse solo : annoncée comme solo', /solo/i.test((d.querySelector('.hub-solo') || {}).textContent || ''));
          crateBtn.click();
          var grp = d.querySelector('.hub-overlay .hub-group-link');
          t('caisse solo : renvoie au Game Hub pour jouer à plusieurs', !!grp && grp.getAttribute('href') === 'games/');
          d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
          t('hub : aucune fenêtre ne reste ouverte', !hub.isOpen());
          done();
        }, reducedMotion ? 300 : 3400);
      }

      function finish() {
        t('aucune erreur JS', errs.length === 0);
        var head = out.ko ? 'DES TESTS ECHOUENT' : 'TOUT PASSE';
        document.getElementById('log').textContent =
          head + ' — ' + out.filter(function (l) { return /^(OK|KO)/.test(l); }).length + ' verifications\n\n' + out.join('\n') +
          (errs.length ? '\n\nERREURS JS:\n' + errs.join('\n') : '');
      }
    }, 1700);
  }, 900);
});
</script>
</body>

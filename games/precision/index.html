<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Précision — party game multijoueur</title>
<meta name="description" content="Party game de précision : mémorise une forme, une couleur, un son ou un timing… puis reproduis-le au plus juste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* DA : carte sombre très épurée, HUD dans les coins, gros chiffres,
     bouton rond blanc. Tout est synthétisé (aucune image, aucun son fichier). */
  * { margin: 0; box-sizing: border-box; }
  :root {
    --bg: #1d1d1f;         /* fond hors carte */
    --card: #0b0b0c;       /* la carte */
    --line: rgba(255,255,255,.09);
    --dim: #7d7d86;
    --ink: #f2f2f4;
    --accent: #c4b5fd;
  }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; padding: 1.2rem;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(560px, 100%); }

  /* ---------- carte ---------- */
  .card {
    position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  .card.play-card { aspect-ratio: 5/6; }
  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .hud .tl, .hud .tr { position: absolute; top: 1.1rem; font-size: .78rem; font-weight: 700; letter-spacing: .04em; }
  .hud .tl { left: 1.2rem; }
  .hud .tr { right: 1.2rem; color: #4a4a52; font-family: 'Space Grotesk', sans-serif; }
  .hud .bl { position: absolute; left: 1.2rem; bottom: 1.2rem; text-align: left; }
  .hud .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 1.4rem;
    font-size: .68rem; color: var(--dim); letter-spacing: .06em; text-align: center; width: 78%; }
  .hud .top-hint { position: absolute; right: 1.2rem; top: 2.6rem; width: 55%; text-align: right;
    font-size: .76rem; color: #6a6a74; line-height: 1.35; font-weight: 700; }

  /* bouton rond principal (bas-droite) */
  .fab {
    position: absolute; right: 1.1rem; bottom: 1.1rem; z-index: 6; pointer-events: auto;
    width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer;
    background: #fff; color: #111; display: grid; place-items: center;
    box-shadow: 0 6px 22px rgba(0,0,0,.5); transition: transform .12s ease, opacity .12s;
  }
  .fab:hover { transform: scale(1.06); }
  .fab:active { transform: scale(.96); }
  .fab svg { width: 22px; height: 22px; }
  .fab.wait { background: #2a2a30; color: #6a6a74; cursor: default; }
  .fab.wait:hover { transform: none; }

  /* barre de temps : fin liseré en haut de la carte */
  #timefill { position: absolute; top: 0; left: 0; height: 2px; width: 100%; z-index: 7;
    background: linear-gradient(90deg,#a78bfa,#67e8f9); }

  .stage { position: absolute; inset: 0; }
  .fill { position: absolute; inset: 0; }

  /* ---------- accueil / lobby ---------- */
  .pad { padding: 1.8rem; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; letter-spacing: -.01em; text-align: center; }
  h1 .a { color: var(--accent); }
  .sub { color: var(--dim); font-size: .72rem; margin: .35rem 0 1.6rem; text-align: center; }
  button { font: inherit; cursor: pointer; background: #fff; color: #111; font-weight: 700;
    border: none; border-radius: 12px; padding: .85rem 1.4rem; width: 100%; transition: opacity .12s; }
  button:hover { opacity: .88; }
  button:disabled { opacity: .35; cursor: default; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
  .ghost:hover { border-color: #6a6a74; opacity: 1; }
  input, select { font: inherit; background: #141416; border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); padding: .85rem 1rem; outline: none; width: 100%; }
  input:focus, select:focus { border-color: #6a6a74; }
  .or { color: #4a4a52; font-size: .7rem; margin: 1rem 0; text-align: center; letter-spacing: .1em; }
  .join-row { display: flex; gap: .5rem; }
  .join-row input { width: 7.5rem; text-align: center; text-transform: uppercase; letter-spacing: .3em; }
  .join-row button { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 400; }
  #name-input { margin-bottom: 1rem; }
  .pick-hint { color: var(--dim); font-size: .7rem; margin-bottom: .5rem; text-align: center; }
  #avatar-row { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; margin-bottom: 1rem; }
  .avatar-pick { font-size: 1.1rem; background: #141416; border: 1px solid var(--line); border-radius: 10px;
    padding: .4rem .5rem; width: auto; font-weight: 400; }
  .avatar-pick.picked { border-color: var(--accent); background: #1a1626; }
  #room-code { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 2.6rem; font-weight: 700;
    letter-spacing: .4em; text-indent: .4em; text-align: center; cursor: pointer; margin: .2rem 0; }
  #code-hint { color: #4a4a52; font-size: .66rem; margin-bottom: 1.2rem; text-align: center; }
  ul { list-style: none; font-size: .82rem; }
  #players li { padding: .55rem .2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .5rem; }
  .tag { color: var(--accent); font-size: .66rem; }
  .pp { margin-right: .15rem; }
  #host-config { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); display: grid; gap: .5rem; }
  #host-config label { font-size: .66rem; color: var(--dim); letter-spacing: .1em; }
  #need-players { color: #4a4a52; font-size: .7rem; margin-top: .9rem; text-align: center; }

  /* ---------- SHAPE ---------- */
  #shape-board { position: absolute; inset: 0; touch-action: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 9.09%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 9.09%); }
  #shape-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hlink { stroke: #c4b5fd88; stroke-width: .5; stroke-dasharray: 1.6 1.3; }
  /* le conteneur couvre le plateau : c'est le repère des poignées (en %) */
  #tri-handles { position: absolute; inset: 0; pointer-events: none; }
  /* poignées : deux rôles = deux couleurs + deux icônes, jamais deux pastilles identiques */
  .handle { position: absolute; width: 30px; height: 30px; border-radius: 50%;
    transform: translate(-50%, -50%); display: grid; place-items: center; cursor: grab;
    background: rgba(10,10,14,.9); backdrop-filter: blur(2px); transition: transform .1s ease; }
  .handle svg { width: 15px; height: 15px; }
  .handle:hover { transform: translate(-50%, -50%) scale(1.12); }
  .handle:active { cursor: grabbing; }
  .handle.rot { border: 1.5px solid #c4b5fd; color: #c4b5fd; box-shadow: 0 0 12px #c4b5fd44; }
  .handle.scale { border: 1.5px solid #67e8f9; color: #67e8f9; box-shadow: 0 0 12px #67e8f944; }

  /* ---------- COLOR ---------- */
  #color-wrap { position: absolute; inset: 0; display: flex; }
  #color-bars { display: flex; gap: 0; width: 0; overflow: hidden; transition: width .25s ease; }
  #color-bars.on { width: 108px; }
  .cbar { position: relative; width: 36px; cursor: pointer; touch-action: none; }
  #bar-h { background: linear-gradient(to bottom,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%); }
  .cbar .knob { position: absolute; left: 50%; width: 22px; height: 22px; border-radius: 50%; background: #fff;
    transform: translate(-50%,-50%); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #color-preview { flex: 1; }

  /* ---------- SOUND ---------- */
  #sound-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: ns-resize; }
  #freq-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 3rem; line-height: 1;
    letter-spacing: -.02em; }
  #freq-big small { font-size: 1.1rem; color: var(--dim); font-weight: 700; }

  /* ---------- TIME ---------- */
  #time-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #chrono { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 3rem; line-height: 1; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  #chrono.masked { color: #2c2c33; }

  /* ---------- REFLEX ---------- */
  #reflex-zone { position: absolute; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: #2a1116; transition: background .05s linear; }
  #reflex-zone.go { background: #10391f; }
  #reflex-zone.oops { background: #3a1020; }
  #reflex-word { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 2.2rem;
    letter-spacing: -.02em; color: #fca5a5; }
  #reflex-zone.go #reflex-word { color: #86efac; }

  /* ---------- TYPING ---------- */
  #typing-wrap { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem; padding: 3.6rem 1.4rem 5rem; }
  /* hauteur figée : changer de bloc ne doit jamais faire sauter la mise en page */
  #typing-words { font-family: 'Space Grotesk', sans-serif; font-size: 1.25rem; line-height: 1.9;
    text-align: center; word-spacing: .3rem; min-height: 8.6rem; max-height: 8.6rem; overflow: hidden;
    display: flex; flex-wrap: wrap; gap: .1rem .55rem; align-content: flex-start; justify-content: center; }
  /* même gabarit pour TOUS les mots : le surlignage ne change que la couleur,
     jamais la largeur — sinon les mots suivants se décalent à chaque validation */
  #typing-words .w { color: #4a4a52; padding: .05rem .35rem; border-radius: 6px; }
  #typing-words .w.ok { color: #86efac; }
  #typing-words .w.ko { color: #fca5a5; text-decoration: line-through; }
  #typing-words .w.now { color: #fff; background: #2b2b33; }
  #typing-input { max-width: 320px; text-align: center; font-size: 1.05rem; }
  #typing-count { font-size: .74rem; color: var(--dim); }

  /* ---------- REVEAL ---------- */
  /* gros score en haut à droite (façon dialed.gg) */
  #score-block { position: absolute; top: 1.9rem; right: 1.2rem; left: 1.2rem; text-align: right; }
  #rv-score { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 3.6rem; line-height: .95;
    letter-spacing: -.03em; color: #fff; }
  #rv-score small { font-size: 1.2rem; color: var(--dim); }
  #rv-quip { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .92rem; color: #6a6a74; margin-top: .35rem; }

  #reveal-view { position: absolute; inset: 0; padding: 3.4rem 1.2rem 5rem; overflow-y: auto; }
  /* quand la scène reste visible derrière (superposition des formes), le
     classement passe en panneau bas translucide au lieu de tout recouvrir */
  #reveal-view.sheet { top: auto; bottom: 0; max-height: 40%; padding: 1rem 1.2rem 4.4rem;
    background: linear-gradient(to bottom, transparent, #0b0b0ce6 18%, #0b0b0c 40%); }
  /* score compact quand la scène reste visible derrière (sinon il masque la forme) */
  #score-block.compact { left: auto; }
  #score-block.compact #rv-score { font-size: 2rem; }
  #score-block.compact #rv-quip { font-size: .72rem; margin-top: .15rem; }
  /* aux résultats, on replie tout le plateau au-dessus du classement :
     la grille entière reste lisible, positions comprises */
  #shape-board.fit { transform: scale(.56); transform-origin: 50% 0%; }
  .rv-compare { display: flex; gap: 1rem; justify-content: center; align-items: flex-end; margin-bottom: 1.1rem; flex-wrap: wrap; }
  .swatch { width: 96px; height: 66px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); }
  .rv-lbl { font-size: .6rem; color: var(--dim); text-align: center; margin-top: .3rem; letter-spacing: .1em; }
  .rv-big { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.5rem; text-align: center; }
  #rv-list { display: grid; gap: .4rem; }
  .rv-row { display: grid; grid-template-columns: 1.4rem 1fr auto; align-items: center; gap: .6rem;
    padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 12px; background: #141416; font-size: .76rem; }
  .rv-row .rk { color: #4a4a52; }
  .rv-row .rd { color: var(--dim); font-size: .66rem; font-variant-numeric: tabular-nums; }
  .rv-row .ra { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .rv-row.me { border-color: var(--accent); }
  .a-hi { color: #86efac; } .a-mid { color: #fde047; } .a-lo { color: #fca5a5; }
  #rv-shape { width: 100%; aspect-ratio: 1/1; max-height: 200px; margin: 0 auto .8rem; display: block; }

  #scores { margin-top: 1rem; }
  #scores li { padding: .5rem .2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .5rem; font-size: .8rem; }
  #scores .pts { margin-left: auto; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }

  #error { margin-top: .9rem; font-size: .74rem; color: #fca5a5; min-height: 1.2em; text-align: center; }
  .back { display: block; margin-top: 1.2rem; color: #4a4a52; font-size: .7rem; text-decoration: none; text-align: center; }
  .back:hover { color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <!-- accueil -->
    <section id="home" class="card pad">
      <h1>Précision<span class="a">.</span></h1>
      <p class="sub">mémorise… puis reproduis au plus juste</p>
      <input id="name-input" maxlength="16" placeholder="ton pseudo" autocomplete="off" spellcheck="false">
      <p class="pick-hint">choisis ton icône</p>
      <div id="avatar-row"></div>
      <button id="host">Créer une partie</button>
      <p class="or">— OU —</p>
      <div class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="join">Rejoindre</button>
      </div>
    </section>

    <!-- lobby -->
    <section id="lobby" class="card pad" hidden>
      <b id="room-code" title="clique pour copier">····</b>
      <p id="code-hint">clique sur le code pour le copier</p>
      <ul id="players"></ul>
      <p id="need-players"></p>
      <div id="host-config" hidden>
        <label for="diff-select">DIFFICULTÉ</label>
        <select id="diff-select">
          <option value="facile">Facile — 5 s / 20 s</option>
          <option value="moyen" selected>Moyen — 3 s / 15 s</option>
          <option value="difficile">Difficile — 2 s / 10 s</option>
          <option value="impossible">Impossible — 1 s / 7 s</option>
        </select>
        <label for="rounds-select">MANCHES</label>
        <select id="rounds-select">
          <option value="3">3</option><option value="5" selected>5</option>
          <option value="8">8</option><option value="12">12</option>
        </select>
        <label for="game-select">ÉPREUVES</label>
        <select id="game-select">
          <option value="" selected>toutes les épreuves (au hasard)</option>
          <option value="shape">Forme seulement</option>
          <option value="color">Couleur seulement</option>
          <option value="sound">Son seulement</option>
          <option value="time">Timing seulement</option>
          <option value="reflex">Réflexe seulement</option>
          <option value="typing">Frappe seulement</option>
        </select>
        <button id="start">Lancer la partie</button>
      </div>
    </section>

    <!-- jeu -->
    <section id="game" class="card play-card" hidden>
      <div id="timefill"></div>

      <div class="stage">
        <!-- SHAPE -->
        <div id="stage-shape" class="fill" hidden>
          <div id="shape-board">
            <svg id="shape-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs>
                <linearGradient id="triGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#5eead4"/><stop offset=".35" stop-color="#a78bfa"/>
                  <stop offset=".7" stop-color="#f0abfc"/><stop offset="1" stop-color="#fb923c"/>
                </linearGradient>
              </defs>
              <path id="tri-ghost" d="" fill="none" stroke="#ffffff55" stroke-width=".7" stroke-dasharray="2 1.6" style="display:none"/>
              <path id="tri" d="" fill="url(#triGrad)"/>
              <line id="h-link" class="hlink" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
            </svg>
            <!-- poignées en HTML : elles restent rondes même si le SVG est étiré -->
            <div id="tri-handles" hidden>
              <div class="handle rot" id="h-rot" title="tourner">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/>
                </svg>
              </div>
              <div class="handle scale" id="h-scale" title="agrandir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 4h5v5"/><path d="M20 4l-7 7"/><path d="M9 20H4v-5"/><path d="M4 20l7-7"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- COLOR -->
        <div id="stage-color" class="fill" hidden>
          <div id="color-wrap">
            <div id="color-bars">
              <div class="cbar" id="bar-h"><div class="knob" id="knob-h"></div></div>
              <div class="cbar" id="bar-s"><div class="knob" id="knob-s"></div></div>
              <div class="cbar" id="bar-l"><div class="knob" id="knob-l"></div></div>
            </div>
            <div id="color-preview"></div>
          </div>
        </div>

        <!-- SOUND -->
        <div id="stage-sound" class="fill" hidden>
          <canvas id="sound-canvas"></canvas>
        </div>

        <!-- TIME -->
        <div id="stage-time" class="fill" hidden>
          <canvas id="time-canvas"></canvas>
        </div>

        <!-- REFLEX -->
        <div id="stage-reflex" class="fill" hidden>
          <div id="reflex-zone"><p id="reflex-word">attends…</p></div>
        </div>

        <!-- TYPING -->
        <div id="stage-typing" class="fill" hidden>
          <div id="typing-wrap">
            <p id="typing-words"></p>
            <input id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="tape ici">
            <p id="typing-count">0 mot</p>
          </div>
        </div>

        <!-- REVEAL -->
        <div id="reveal-view" hidden>
          <div class="rv-compare" id="rv-compare"></div>
          <svg id="rv-shape" viewBox="0 0 100 100" hidden>
            <path id="rv-tri-target" d="" fill="none" stroke="#ffffff77" stroke-width=".7" stroke-dasharray="2 1.6"/>
            <path id="rv-tri-mine" d="" fill="url(#triGrad)" opacity=".85"/>
          </svg>
          <div id="rv-list"></div>
          <ul id="scores" hidden></ul>
        </div>
      </div>

      <!-- HUD par-dessus -->
      <div class="hud">
        <span class="tl" id="hud-round">1 / 5</span>
        <span class="tr">précision.</span>
        <div class="bl" id="hud-bl">
          <p id="freq-big" hidden>440.00<small>Hz</small></p>
          <p id="chrono" hidden>0.000</p>
        </div>
        <div id="score-block" hidden>
          <p id="rv-score">0.0<small>%</small></p>
          <p id="rv-quip"></p>
        </div>
        <p class="top-hint" id="phase-title"></p>
        <p class="hint" id="phase-sub"></p>
      </div>

      <button class="fab" id="fab" hidden></button>
    </section>

    <p id="error"></p>
    <a class="back" href="/">← retour au portfolio</a>
  </main>
  <script src="net.js"></script>
  <script src="app.js"></script>
</body>
</html>

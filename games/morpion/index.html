<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpion — multijoueur · Mathys Langiny</title>
<meta name="description" content="Morpion multijoueur en ligne - crée une partie, partage le code, joue.">
<link rel="canonical" href="https://mathyslan.github.io/games/morpion/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mathys Langiny">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Morpion — multijoueur">
<meta property="og:description" content="Morpion multijoueur en ligne - crée une partie, partage le code, joue.">
<meta property="og:url" content="https://mathyslan.github.io/games/morpion/">
<meta property="og:image" content="https://mathyslan.github.io/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a12">
<!-- Socle commun des pages de jeux : focus clavier, mouvement réduit, cibles
     tactiles, messages d'état, et les deux polices auto-hébergées (plus aucun
     appel à Google Fonts). La DA du jeu reste dans le <style> ci-dessous. -->
<link rel="stylesheet" href="../../css/tf2.css?v=9">
<link rel="stylesheet" href="../shared/game-ui.css?v=5">
<style>
  /* L'accent du Morpion : le violet de son X. Tout le chrome — panneaux,
     boutons, champs, titres, salon, code de salle — vient du socle commun
     (games/shared/game-ui.css) exprimé avec les jetons de css/tf2.css.
     Ici il ne reste que la MISE EN PAGE et le PLATEAU. */
  :root { --g-accent: #8b5cf6; --g-accent-ink: #0f0b1a; }

  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main { width: min(420px, 100%); text-align: center; }
  h1 .o { color: var(--q-unique); }

  .join-row { justify-content: center; }
  .join-row button { flex: 0 0 auto; }

  .meta { display: flex; justify-content: space-between; font-size: .75rem; color: var(--ink-3); margin-bottom: .4rem; }
  .meta b { color: var(--g-accent); letter-spacing: .2em; }
  /* Le code se copie au clic, comme partout. Ici il vit dans une rangee de
     meta : en ligne et a la taille du texte, pas en bloc de 2,4rem comme le
     defaut du socle. C'est la difference voulue que .g-copy laisse passer. */
  #room-code { display: inline; width: auto; font-size: inherit; text-indent: 0;
    color: var(--g-accent); letter-spacing: .2em; }
  #room-code:hover { color: var(--ink); }
  #code-hint { margin-bottom: .9rem; }
  /* --- LE PLATEAU : le gameplay, et il reste lui-meme. Pas de coin coupe,
         pas de biseau, pas de capitales : le Mann Co. est le langage de
         l'interface, pas celui de la grille. --- */
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cell {
    aspect-ratio: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.1rem;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
    padding: 0;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: none;
    clip-path: none;
    color: var(--ink);
  }
  .cell:hover { filter: none; background: #171724; border-color: rgba(139, 92, 246, .5); }
  .cell:active { transform: none; }
  .cell:disabled { cursor: default; background: var(--bg-deep); }
  .cell.X { color: #8b5cf6; }
  .cell.O { color: #f59e0b; }
  .cell.win { border-color: #34d399; box-shadow: 0 0 14px -4px #34d399; }

  #status { margin-top: 1.2rem; font-size: .85rem; color: var(--ink-3); min-height: 1.4em; }
  #error { margin-top: 1rem; }
  /* Connexion perdue (games/shared/game-net.js) : un panneau simple, jamais le
     plateau ou l'attente d'avant (qui mentiraient). */
  #lost { text-align: center; }
  #lost-text { margin: .4rem 0 1rem; line-height: 1.5; }
  #lost button { display: block; margin: .6rem auto 0; }
  /* Retour au Game Hub (partie lancée par le Hub) : un lien simple, sous le
     plateau ou sous « connexion perdue ». Jamais `.back`, qui garde son sens
     de « retour au portfolio ». */
  #to-hub, #lost-hub { display: block; margin-top: .9rem; color: var(--g-accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <h1>Morpion <span class="x">✕</span><span class="o">◯</span></h1>
    <p class="sub">multijoueur — le serveur arbitre, le front affiche</p>

    <section id="home" class="panel g-screen">
      <button id="host">Créer une partie</button>
      <p class="or">— ou —</p>
      <div class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="join">Rejoindre</button>
      </div>
    </section>

    <section id="game" class="panel g-screen" hidden>
      <div class="meta">
        <span>room <button type="button" id="room-code" class="g-copy" title="clique pour copier">····</button></span>
        <span>tu joues <b id="you">·</b></span>
      </div>
      <p id="code-hint" role="status">clique sur le code pour le copier</p>
      <div id="board"></div>
      <p id="status" role="status"></p>
      <a id="to-hub" href="../" hidden>↩ Retour au Game Hub</a>
    </section>

    <!-- connexion perdue (`lost`, games/shared/game-net.js) : le Morpion ferme sa
         room quand un joueur part, il n'y a donc pas de salon où revenir. -->
    <section id="lost" class="panel g-screen" hidden>
      <p><b>Connexion perdue</b></p>
      <p id="lost-text" role="status"></p>
      <button type="button" id="lost-new">Créer une nouvelle partie</button>
      <button type="button" id="lost-home" class="ghost">Retour à l'accueil</button>
      <a id="lost-hub" href="../" hidden>↩ Retour au Game Hub</a>
    </section>

    <p id="error" class="g-error" role="alert"></p>
    <a class="back" href="../../">← retour au portfolio</a>
  </main>
  <!-- ⚠️ AUCUNE identité ne part vers morpion-server, et c'est VOULU.
       Il lit `onJoin(ws, msg.code)` : ni pseudo, ni avatar — vérifié dans
       morpion-server/src/server.js. Cette page n'a d'ailleurs ni #name-input
       ni #avatar-row, et net.js n'envoie que `{ action: 'join', code? }`.
       game-profile.js n'est chargé QUE pour le Game Hub : hub-handoff.js se
       présente au Hub avec le même player.id que sur /games/. Il ne remplit
       rien ici (pas de champ à remplir) et n'ajoute aucune interface. -->
  <script src="../shared/game-profile.js"></script>
  <!-- Transport commun : connexion, présence du joueur, perte de connexion. -->
  <script src="../shared/game-net.js"></script>
  <!-- Lancé par le Game Hub : billet en sessionStorage, sinon rien ne change. -->
  <script src="../shared/game-hub.js"></script>
  <script src="../shared/hub-handoff.js"></script>
  <script src="net.js?v=2"></script>
</body>
</html>

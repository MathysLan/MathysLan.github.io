<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpion — multijoueur · Mathys Langiny</title>
<meta name="description" content="Morpion multijoueur en ligne - crée une partie, partage le code, joue.">
<link rel="canonical" href="https://mathyslan.github.io/games/morpion/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mathys Langiny">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Morpion — multijoueur">
<meta property="og:description" content="Morpion multijoueur en ligne - crée une partie, partage le code, joue.">
<meta property="og:url" content="https://mathyslan.github.io/games/morpion/">
<meta property="og:image" content="https://mathyslan.github.io/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a12">
<!-- Socle commun des pages de jeux : focus clavier, mouvement réduit, cibles
     tactiles, messages d'état, et les deux polices auto-hébergées (plus aucun
     appel à Google Fonts). La DA du jeu reste dans le <style> ci-dessous. -->
<link rel="stylesheet" href="../_shared/game-ui.css?v=1">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a12;
    color: #e7e5f4;
    font-family: 'JetBrains Mono', monospace;
    padding: 1.5rem;
  }
  main { width: min(420px, 100%); text-align: center; }
  h1 { font-size: 1.3rem; margin-bottom: .4rem; }
  h1 .x { color: #8b5cf6; }
  h1 .o { color: #f59e0b; }
  .sub { color: #8b87a0; font-size: .75rem; margin-bottom: 2rem; }

  .card {
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 1.6rem;
  }
  button {
    font: inherit;
    cursor: pointer;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: .8rem 1.4rem;
  }
  button:hover { background: #6d28d9; }
  .or { color: #8b87a0; font-size: .75rem; margin: 1.1rem 0; }
  .join-row { display: flex; gap: .6rem; justify-content: center; }
  input {
    font: inherit;
    width: 7.5rem;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .3em;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    color: #e7e5f4;
    padding: .8rem .4rem;
    outline: none;
  }
  input:focus { border-color: #8b5cf6; }
  .join-row button { background: transparent; border: 1px solid rgba(255, 255, 255, 0.18); color: #e7e5f4; }
  .join-row button:hover { border-color: #34d399; color: #34d399; background: transparent; }

  .meta { display: flex; justify-content: space-between; font-size: .75rem; color: #9b98ad; margin-bottom: .4rem; }
  .meta b { color: #34d399; letter-spacing: .2em; }
  /* Le code se copie au clic, comme dans les quatre autres jeux. Ici il vit
     dans une rangee de meta : en ligne, pas en bloc comme .g-copy par defaut. */
  #room-code { display: inline; width: auto; color: #34d399; letter-spacing: .2em; }
  #room-code:hover { color: #6ee7b7; }
  #code-hint { color: #8b87a0; font-size: .7rem; margin-bottom: .9rem; min-height: 1.2em; }
  #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cell {
    aspect-ratio: 1;
    font-size: 2.1rem;
    font-weight: 700;
    background: #11111c;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #e7e5f4;
  }
  .cell:hover { background: #171724; border-color: rgba(139, 92, 246, 0.5); }
  .cell:disabled { cursor: default; background: #11111c; }
  .cell.X { color: #8b5cf6; }
  .cell.O { color: #f59e0b; }
  .cell.win { border-color: #34d399; box-shadow: 0 0 14px -4px #34d399; }

  #status { margin-top: 1.2rem; font-size: .85rem; color: #9b98ad; min-height: 1.4em; }
  #error { margin-top: 1rem; font-size: .8rem; color: #ef4444; min-height: 1.2em; }
  .back { display: inline-block; margin-top: 1.6rem; color: #8b87a0; font-size: .75rem; text-decoration: none; }
  .back:hover { color: #e7e5f4; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <h1>Morpion <span class="x">✕</span><span class="o">◯</span></h1>
    <p class="sub">multijoueur — le serveur arbitre, le front affiche</p>

    <section id="home" class="card">
      <button id="host">Créer une partie</button>
      <p class="or">— ou —</p>
      <div class="join-row">
        <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="join">Rejoindre</button>
      </div>
    </section>

    <section id="game" class="card" hidden>
      <div class="meta">
        <span>room <button type="button" id="room-code" class="g-copy" title="clique pour copier">····</button></span>
        <span>tu joues <b id="you">·</b></span>
      </div>
      <p id="code-hint" role="status">clique sur le code pour le copier</p>
      <div id="board"></div>
      <p id="status" role="status"></p>
    </section>

    <p id="error" class="g-error" role="alert"></p>
    <a class="back" href="../../">← retour au portfolio</a>
  </main>
  <script src="net.js"></script>
</body>
</html>
